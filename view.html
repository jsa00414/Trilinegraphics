<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Client website — Triline Graphics</title>
    <meta name="robots" content="noindex,nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=Sora:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="view">
    <div class="client-bar view-bar" id="view-bar" hidden>
      <strong id="view-label">Triline client preview</strong>
      <div class="client-bar-actions">
        <a href="portal.html">Portal</a>
        <a class="exit" href="portal.html" id="view-exit">Exit &amp; lock</a>
      </div>
    </div>
    <div class="view-frame-wrap">
      <iframe id="view-frame" title="Client website" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
      <p class="view-status" id="view-status">Checking portal access…</p>
    </div>
    <script src="view.js"></script>
  </body>
</html>
